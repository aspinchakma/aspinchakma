name: Generate Dragon Contribution Graph

on:
  schedule:
    # প্রতি ৬ ঘণ্টা পর পর রান হবে
    - cron: "0 */6 * * *"
  
  # ম্যানুয়ালি রান করার জন্য
  workflow_dispatch:
  
  # main ব্রাঞ্চে কিছু push হলে রান করবে
  push:
    branches:
      - main
      - master

jobs:
  build:
    name: Generate Dragon Activity Map
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: write

    steps:
      - name: Checkout repository
      - uses: actions/checkout@v4

      # Snake-এর কালারগুলো ড্রাগনের মতো পরিবর্তন করে এবং থিম যুক্ত করে
      - name: Generate dragon style SVG
        uses: Platane/snk/svg-only@v3
        with:
          github_user_name: aspinchakma
          outputs: |
            dist/github-dragon.svg
            dist/github-dragon-dark.svg?palette=github-dark
            # Dragon Fire / Volcanic theme
            dist/github-dragon-volcano.svg?color_snake=#ff3d00&color_dots=#121212,#5e0a0a,#ac1313,#d73838,#ff6a39
            # Mystic Dragon (Neon Blue/Green) theme
            dist/github-dragon-mystic.svg?color_snake=#00fff2&color_dots=#161b22,#0f3630,#146b5a,#21b8a5,#2bffe1

      # Generated file গুলো output নামের ব্রাঞ্চে push করবে
      - name: Push dragon graphics to output branch
        uses: crazy-max/ghaction-github-pages@v3.1.0
        with:
          target_branch: output
          build_dir: dist
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
