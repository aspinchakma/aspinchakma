name: Generate Contribution Snake

on:
  schedule:
    # Runs automatically every 6 hours
    - cron: "0 */6 * * *"
  
  # Allows manual triggering from the Actions tab
  workflow_dispatch:
  
  # Runs on every push to main/master branch
  push:
    branches:
      - main
      - master

jobs:
  build:
    name: Generate Snake Animation
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: write

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      # Generates SVG & GIF with customized color themes
      - name: Generate Snake Media
        uses: Platane/snk@v3
        with:
          github_user_name: aspinchakma
          outputs: |
            dist/github-snake.svg
            dist/github-snake-dark.svg?palette=github-dark
            dist/github-snake-ocean.svg?color_snake=#00f2fe&color_dots=#ebedf0,#9be9a8,#40c463,#30a14e,#216e39
            dist/github-snake-cyberpunk.svg?color_snake=#ff007f&color_dots=#161b22,#0e4429,#006d32,#26a641,#39d353
            dist/github-snake.gif?color_snake=#7f00ff&color_dots=#ebedf0,#c084fc,#a855f7,#9333ea,#6b21a8

      # Automatically deploys the generated files to the 'output' branch
      - name: Deploy to Output Branch
        uses: crazy-max/ghaction-github-pages@v3.1.0
        with:
          target_branch: output
          build_dir: dist
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
